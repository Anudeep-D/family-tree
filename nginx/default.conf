# Security headers configuration
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Gzip compression for performance
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;

server {
    listen 80;                                      # Listen on port 80 for HTTP
    server_name familytree;                         # Server name (can be a domain or localhost)

    root /usr/share/nginx/html;                     # Root directory to serve static files
    index index.html;                               # Default file served

    # Redirect HTTP to HTTPS in production
    # Uncomment this in production and configure HTTPS below
    # return 301 https://$server_name$request_uri;

    location / {
        try_files $uri  /index.html;                 # Serve index.html for all routes (for React SPA)
        
        # Cache busting for index.html
        if ($request_filename ~* ^.*?\.(html|htm)$) {
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }
    }

    location /images/ {
        try_files $uri $uri/ =404;
        # Cache images for 30 days
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # New/Modified block for WebSocket
    location /api/ws/ {
        proxy_pass http://backend:8080/api/ws/;     # Forward WebSocket requests
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # Crucial for WebSocket
        proxy_set_header Connection "upgrade";        # Crucial for WebSocket
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;             # Useful for WebSockets
        # Optional: Increase timeouts if needed, though defaults are usually fine
        # proxy_connect_timeout 60s;
        # proxy_send_timeout 60s;
        # proxy_read_timeout 60s;
    }

    # Existing block for general API calls
    location /api/ {
        proxy_pass http://backend:8080/api/;        # Forward API requests to Spring Boot backend
        proxy_set_header Host $host;                # Preserve the original host header
        proxy_set_header X-Real-IP $remote_addr;    # Pass client IP to backend
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Added for consistency
        proxy_set_header X-Forwarded-Proto $scheme; # Added for consistency
        
        # Security: Disable caching for API responses (unless you have specific caching needs)
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }
}

